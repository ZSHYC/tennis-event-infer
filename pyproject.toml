[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-event-infer"
version = "1.0.0"
description = "trajectory + patch 网球事件纯推理工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.3",
  "opencv-python>=4.8,<5",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<0.13"]

[project.scripts]
tennis-event-infer = "tennis_event_infer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tennis_event_infer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E9", "F"]
